[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-rag-debugger"
version = "0.1.0"
description = "Multi-agent RAG system for software debugging and automated fix validation"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50,<4.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=2.0",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
